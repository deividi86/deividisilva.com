<html lang="en">
<head>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body {
      font-family: "Space Grotesk", sans-serif;
      background: #0c0c0c;
      color: #8a8a8a;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* grid lines background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .layout {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2.5rem;
      align-items: center;
      max-width: 680px;
      width: 100%;
      animation: fadeIn 0.6s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .photo-col {
      animation: fadeIn 0.6s ease 0.1s both;
    }

    .headshot {
      width: 140px;
      height: 140px;
      border-radius: 12px;
      object-fit: cover;
      display: block;
      border: 1px solid #1e1e1e;
      transition: border-color 0.3s;
    }

    .headshot:hover {
      border-color: #0aff9d;
    }

    .info {
      animation: fadeIn 0.6s ease 0.15s both;
    }

    .tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #0aff9d;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tag::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #0aff9d;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #f0f0f0;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      line-height: 1.1;
    }

    .bio {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #6a6a6a;
      margin-bottom: 1.5rem;
    }

    .bio a {
      color: #b0b0b0;
      text-decoration: none;
      border-bottom: 1px dashed #333;
      transition: color 0.2s, border-color 0.2s;
    }

    .bio a:hover {
      color: #0aff9d;
      border-color: #0aff9d;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .links a {
      color: #3a3a3a;
      transition: color 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .links a:hover {
      color: #0aff9d;
      border-color: #1a1a1a;
      background: rgba(10, 255, 157, 0.04);
    }

    .links svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @media (max-width: 540px) {
      .layout {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 1.5rem;
      }
      .photo-col { justify-self: center; }
      .tag { justify-content: center; }
      .links { justify-content: center; }
      .headshot { width: 120px; height: 120px; }
    }
  </style>
</head>
