  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { height: 100%; }

    body {
      font-family: "DM Sans", sans-serif;
      background: #0a0a0a;
      color: #94908a;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      text-align: center;
      max-width: 480px;
      width: 100%;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .headshot-wrap {
      width: 148px;
      height: 148px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, #2a2722, #1a1916);
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    .headshot {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      filter: grayscale(15%);
      transition: filter 0.5s ease;
    }

    .headshot:hover {
      filter: grayscale(0%);
    }

    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 2.4rem;
      font-weight: 400;
      color: #ede9e3;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.75;
      color: #7a766f;
      margin-bottom: 2.25rem;
      font-weight: 400;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    .bio a {
      color: #b8b2a8;
      text-decoration: none;
      border-bottom: 1px solid #33302b;
      transition: color 0.3s, border-color 0.3s;
    }

    .bio a:hover {
      color: #ede9e3;
      border-color: #ede9e3;
    }

    .divider {
      width: 32px;
      height: 1px;
      background: #2a2722;
      margin: 0 auto 2rem;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
    }

    .links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }

    .links a {
      color: #4a4740;
      transition: color 0.3s, transform 0.3s;
      display: flex;
      align-items: center;
    }

    .links a:hover {
      color: #ede9e3;
      transform: translateY(-2px);
    }

    .links svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
